<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>

  <!-- Gradient overlay -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4ade80;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Accent bar -->
  <rect x="100" y="200" width="6" height="230" rx="3" fill="url(#accentGrad)"/>

  <!-- Stars / decorative dots -->
  <circle cx="950" cy="120" r="3" fill="#4ade80" opacity="0.8"/>
  <circle cx="1020" cy="80" r="2" fill="#22d3ee" opacity="0.6"/>
  <circle cx="1080" cy="150" r="4" fill="#4ade80" opacity="0.5"/>
  <circle cx="1100" cy="100" r="2" fill="#22d3ee" opacity="0.7"/>
  <circle cx="1140" cy="60" r="3" fill="#4ade80" opacity="0.6"/>
  <circle cx="980" cy="180" r="2" fill="#22d3ee" opacity="0.5"/>
  <circle cx="1060" cy="200" r="3" fill="#4ade80" opacity="0.4"/>

  <!-- Chart icon (simplified bar chart) -->
  <g transform="translate(900, 260)" opacity="0.3">
    <rect x="0" y="80" width="30" height="60" rx="4" fill="#4ade80"/>
    <rect x="45" y="40" width="30" height="100" rx="4" fill="#22d3ee"/>
    <rect x="90" y="60" width="30" height="80" rx="4" fill="#4ade80"/>
    <rect x="135" y="20" width="30" height="120" rx="4" fill="#22d3ee"/>
    <rect x="180" y="50" width="30" height="90" rx="4" fill="#4ade80"/>
  </g>

  <!-- Main title -->
  <text
    x="140"
    y="300"
    font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif"
    font-size="72"
    font-weight="bold"
    fill="#ffffff"
    letter-spacing="4"
  >エンジニア幸福度マップ</text>

  <!-- Subtitle -->
  <text
    x="140"
    y="380"
    font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif"
    font-size="36"
    fill="#94a3b8"
    letter-spacing="2"
  >あなたの職場の幸福度を確認しよう</text>

  <!-- Accent line under title -->
  <rect x="140" y="320" width="920" height="3" rx="2" fill="url(#accentGrad)" opacity="0.6"/>

  <!-- URL label -->
  <text
    x="140"
    y="530"
    font-family="'Hiragino Sans', 'Noto Sans JP', 'Yu Gothic', sans-serif"
    font-size="24"
    fill="#4ade80"
    opacity="0.8"
  >engineer-happiness-map.com</text>
</svg>
